<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#102218" />
  <title>Can It Fit?</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app">
    <header><div class="mark">↔</div><div><h1>Can It Fit?</h1><p>See before you move it.</p></div></header>
    <section class="progress" aria-label="Progress"><span class="active"></span><span></span><span></span></section>
    <p class="privacy">Photos are sent to our AI provider for analysis and are not stored on our servers.</p>
    <section id="screen" class="card" aria-live="polite"></section>
    <button id="back" class="text-button" hidden>← Back</button>
  </main>
  <input id="camera" type="file" accept="image/*" capture="environment" hidden />
  <input id="upload" type="file" accept="image/*" hidden />
  <script src="/app.js"></script>
</body>
</html>
